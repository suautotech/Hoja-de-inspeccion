<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Inspección Técnica - Taller Móvil</title>
    <style>
        :root { --primary: #d97706; --primary-dark: #b45309; --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; --border: #e5e7eb; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 900px; margin: 0 auto; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 15px; margin-bottom: 20px; gap: 15px; }
        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card-section { background: #f9fafb; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 15px; }
        .card-section h3 { font-size: 15px; margin-bottom: 10px; color: var(--primary-dark); border-bottom: 1px solid #e5e7eb; padding-bottom: 5px; }
        .field { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
        .field label { font-weight: 600; width: 35%; }
        .field input { width: 63%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .table-responsive { overflow-x: auto; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        th { background: #f3f4f6; font-weight: 600; }
        .category-header { background: #fef3c7; font-weight: bold; color: #92400e; }
        .radio-cell { text-align: center; width: 50px; }
        textarea { width: 100%; height: 70px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; }
        
        /* Contenedores para impresión */
        .print-only { display: none; }
        
        .photos-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .photo-item { width: 90px; height: 90px; border-radius: 6px; overflow: hidden; border: 1px solid #ccc; position: relative; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .btn-delete-photo { position: absolute; top: 0; right: 0; background: red; color: white; border: none; font-size: 10px; cursor: pointer; padding: 2px 5px; border-radius: 0 0 0 5px; }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #4b5563; color: white; }

        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; max-width: 100%; }
            .btn-group, .history, input[type="file"], .btn-delete-photo { display: none !important; }
            textarea { display: none !important; }
            .print-only { display: block !important; white-space: pre-wrap; font-size: 14px; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
            input { border: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Hoja de Inspección SU AutoTech</h1>
    </div>

    <div class="grid-2">
        <div class="card-section">
            <h3>📋 Datos del Servicio</h3>
            <div class="field"><label>Cliente:</label><input type="text" id="cliente"></div>
            <div class="field"><label>Fecha:</label><input type="date" id="fecha"></div>
            <div class="field"><label>Orden N°:</label><input type="text" id="orden"></div>
        </div>
        <div class="card-section">
            <h3>🚗 Datos del Vehículo</h3>
            <div class="field"><label>Vehículo:</label><input type="text" id="vehiculo"></div>
            <div class="field"><label>Placa/KM:</label><input type="text" id="km"></div>
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <tbody id="inspectionBody"></tbody>
        </table>
    </div>

    <div class="card-section">
        <h3>📋 Recomendaciones</h3>
        <textarea id="observaciones" oninput="syncText('observaciones')"></textarea>
        <div class="print-only" id="print-observaciones"></div>
    </div>

    <div class="card-section">
        <h3>🛠️ Materiales y Repuestos</h3>
        <textarea id="repuestos" oninput="syncText('repuestos')"></textarea>
        <div class="print-only" id="print-repuestos"></div>
    </div>

    <div class="card-section">
        <h3>📸 Evidencia</h3>
        <input type="file" id="photoInput" accept="image/*" multiple onchange="loadPhotos(event)">
        <div class="photos-grid" id="photosGrid"></div>
    </div>

    <div class="btn-group">
        <button class="btn-primary" onclick="guardarReporte()">💾 Guardar</button>
        <button class="btn-secondary" onclick="window.print()">🖨️ Imprimir PDF</button>
        <button class="btn-secondary" onclick="limpiarFormulario()">➕ Nuevo</button>
    </div>

    <div class="history">
        <h3>📁 Historial</h3>
        <div class="table-responsive">
            <table>
                <thead><tr><th>Orden</th><th>Cliente</th><th>Acciones</th></tr></thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- Lógica del Sistema ---
    const items = [
        { cat: "1. Motor", list: ["Fugas de aceite", "Refrigerante", "Correas"] },
        { cat: "2. Eléctrico", list: ["Batería", "Alternador"] },
        { cat: "3. Frenos", list: ["Pastillas", "Discos", "Líquido"] }
    ];

    let photos = [];

    // Función para sincronizar texto para imprimir
    function syncText(id) {
        document.getElementById('print-' + id).innerText = document.getElementById(id).value;
    }

    function initTable() {
        const tbody = document.getElementById('inspectionBody');
        items.forEach((group, idx) => {
            tbody.innerHTML += `<tr><td colspan="5" class="category-header">${group.cat}</td></tr>`;
            group.list.forEach(item => {
                tbody.innerHTML += `<tr><td>${item}</td><td><input type="radio" name="${item}"></td></tr>`;
            });
        });
    }

    function loadPhotos(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (evt) => { photos.push(evt.target.result); renderPhotos(); }
            reader.readAsDataURL(file);
        });
    }

    function renderPhotos() {
        const grid = document.getElementById('photosGrid');
        grid.innerHTML = '';
        photos.forEach((p, idx) => {
            grid.innerHTML += `<div class="photo-item"><img src="${p}"><button class="btn-delete-photo" onclick="photos.splice(${idx},1); renderPhotos()">X</button></div>`;
        });
    }

    function guardarReporte() {
        alert("Reporte guardado");
        // Aquí iría tu lógica real de localStorage
    }

    function limpiarFormulario() {
        document.querySelectorAll('input[type="text"], textarea').forEach(i => i.value = '');
        photos = [];
        renderPhotos();
        syncText('observaciones');
        syncText('repuestos');
    }

    window.onload = function() { 
        initTable(); 
        syncText('observaciones'); 
        syncText('repuestos'); 
    };
</script>
</body>
    </html>
